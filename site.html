<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkifOS | Geleceğin İşletim Sistemi</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00d4ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            border: 1px solid #333;
            padding: 50px;
            border-radius: 20px;
            background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.2);
            max-width: 600px;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow: 0 0 15px #00d4ff;
        }
        p { color: #888; font-size: 1.1rem; }
        .terminal {
            background: #000;
            color: #0f0;
            padding: 20px;
            text-align: left;
            border-radius: 10px;
            margin: 30px 0;
            font-family: 'Courier New', Courier, monospace;
            border-left: 5px solid #00d4ff;
        }
        .download-btn {
            background-color: #00d4ff;
            color: #000;
            padding: 18px 45px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            font-size: 1.2rem;
            transition: all 0.4s ease;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }
        .download-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.6);
            background-color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AkifOS</h1>
        <p>Hızlı. Özgür. Akif Eymen imzalı.</p>
        
        <div class="terminal">
            $ sudo pacman -Sy dos2unix<br>
            $ dos2unix kur.sh<br>
            $ chmod +x kur.sh<br>
            $ ./kur.sh --start
        </div>

        <p>Boyut: 1.5 GB | x86_64 | 2026</p>
        <br>
        <a href="SENIN_DRIVE_LINKIN_BURAYA" class="download-btn">CANAVARI İNDİR</a>
    </div>
</body>
</html>
